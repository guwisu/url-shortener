name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run Mypy
        run: uv run mypy src

  tests:
    name: Pytest with PostgreSQL and Redis
    needs: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_url_shortener
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -d test_url_shortener -U test_user" 
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: test_url_shortener
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434

      REDIS_HOST: localhost
      REDIS_PORT: 6380

      JWT_SECRET_KEY: super-secret-test-key-at-least-32-bytes
      JWT_ALGORITHM: HS256

      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//

      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      KAFKA_CLICK_TOPIC: clicks
      ANALYTICS_SALT: test-salt-for-ci

      MONGO_DB: test_url_shortener
      MONGO_USER: mongo
      MONGO_PASSWORD: mongo
      MONGO_HOST: localhost
      MONGO_PORT: 27018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Run Pytest
        run: uv run pytest -v