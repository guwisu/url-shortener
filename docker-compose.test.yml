services:
  test_db:
    container_name: test_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_url_shortener
    ports:
      - "5434:5432"

  test_redis:
    container_name: test_redis
    image: redis:7-alpine
    ports:
      - "6380:6379"