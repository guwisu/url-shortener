[project]
name = "url-shortener"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guwisu"}
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "ruff>=0.17.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
url-shortener = "url_shortener:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
