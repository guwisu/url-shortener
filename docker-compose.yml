services:
  postgres:
    image: postgres:17
    container_name: url-shortener-postgres
    environment:
      PG_DB: ${PG_DB:?PG_DB is required}
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    ports:
     - "${PG_PORT:-5555}:5432"
    volumes:
     - postgres_data:/var/liv/postgresql/data

volumes:
  postgres_data: